    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Backend pendataan perusahaan berbasis kuesioner SE2026 Kuesioner L
    (UB & UMKM & Mahasiswa)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Backend pendataan perusahaan SE2026-L.UB
  version: "1.0"
paths:
  /admin:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Admin'
            type: array
      security:
      - BearerAuth: []
      summary: List semua admin
      tags:
      - Admin
    post:
      parameters:
      - description: Admin data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateAdminRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Admin'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tambah admin baru
      tags:
      - Admin
  /admin/{id}:
    delete:
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Admin'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hapus admin
      tags:
      - Admin
    get:
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Admin'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Detail admin
      tags:
      - Admin
    patch:
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: integer
      - description: Admin data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateAdminRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Admin'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update admin
      tags:
      - Admin
  /admin/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Admin'
      security:
      - BearerAuth: []
      summary: Profil admin yang sedang login
      tags:
      - Admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Mengembalikan JWT access_token untuk endpoint yang dilindungi
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login admin
      tags:
      - Auth
  /logs:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by HTTP method
        in: query
        name: method
        type: string
      - description: Filter by status code
        in: query
        name: statusCode
        type: integer
      - description: Filter by admin ID
        in: query
        name: adminId
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List log aktivitas API
      tags:
      - Logs
  /logs/summary:
    get:
      parameters:
      - default: 7
        description: Days back
        in: query
        name: days
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ringkasan statistik log API
      tags:
      - Logs
